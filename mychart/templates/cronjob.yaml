apiVersion: batch/v1
kind: CronJob
metadata:
 name: node-cron-job
 namespace: {{ .Values.cron.namespace }}

spec:
 schedule: "*/5 * * * *"
 successfulJobsHistoryLimit: 2
 failedJobsHistoryLimit: 1
 jobTemplate:
   spec:
    template:
      spec:
         containers:
         - name: cron-hello
           image: busybox
           command: ["echo","hello node app i am created healthy"]    
         restartPolicy: OnFailure
